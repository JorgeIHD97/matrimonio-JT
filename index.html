<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f7f5f0"
  >

  <title>J & T · 15.08.2026</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="app">

    <!-- =========================
         PANTALLA INICIAL
    ========================== -->

    <section
      id="inicio"
      class="pantalla"
    >

      <div class="monograma">
        J & T
      </div>

      <p class="fecha">
        15 . 08 . 2026
      </p>

      <p class="mensaje">
        Comparte un recuerdo<br>
        de nuestro día
      </p>

      <button
        id="abrirCamara"
        class="boton"
      >
        ABRIR CÁMARA
      </button>

    </section>


    <!-- =========================
         CÁMARA
    ========================== -->

    <section
      id="camara"
      class="pantalla camaraPantalla oculto"
    >

      <div class="visor">

        <video
          id="video"
          autoplay
          playsinline
        ></video>

        <img
          id="marco"
          src="marco.png"
          alt=""
        >

      </div>


      <!-- CONTROLES DE ZOOM -->

      <div class="controlesZoom">

        <button
          id="zoom05"
          class="zoomBoton"
        >
          0.5×
        </button>

        <button
          id="zoom1"
          class="zoomBoton activo"
        >
          1×
        </button>

        <button
          id="zoom2"
          class="zoomBoton"
        >
          2×
        </button>

      </div>


      <!-- DESLIZADOR -->

      <div class="zoomDeslizador">

        <span>−</span>

        <input
          id="zoomSlider"
          type="range"
          min="0.5"
          max="2"
          step="0.01"
          value="1"
        >

        <span>+</span>

      </div>


      <!-- CONTROLES PRINCIPALES -->

      <div class="controles">

        <button
          id="cambiarCamara"
          class="boton pequeño"
          aria-label="Cambiar cámara"
        >
          ↻
        </button>

        <button
          id="tomarFoto"
          class="disparador"
          aria-label="Tomar fotografía"
        >

          <span></span>

        </button>

      </div>

    </section>


    <!-- =========================
         RESULTADO
    ========================== -->

    <section
      id="resultado"
      class="pantalla oculto"
    >

      <div class="fotoResultado">

        <img
          id="fotoFinal"
          alt="Foto del matrimonio"
        >

      </div>


      <div class="acciones">

        <button
          id="compartir"
          class="boton"
        >
          COMPARTIR
        </button>


        <a
          id="descargar"
          class="boton secundario"
          download="J-T-15-08-2026.png"
        >
          GUARDAR FOTO
        </a>


        <button
          id="otraFoto"
          class="textoBoton"
        >
          TOMAR OTRA FOTO
        </button>

      </div>

    </section>

  </main>


  <script src="app.js"></script>

</body>
</html>
