<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>J & T · 15.08.2026</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==================================================
       PANTALLA INICIAL
  =================================================== -->

  <main id="inicio" class="pantalla inicio">

    <div class="inicioContenido">

      <h1>J & T</h1>

      <p>
        15.08.2026
      </p>

      <button
        id="abrirCamara"
        type="button"
      >
        ABRIR CÁMARA
      </button>

    </div>

  </main>


  <!-- ==================================================
       PANTALLA DE CÁMARA
  =================================================== -->

  <main
    id="camara"
    class="pantalla camara oculto"
  >

    <div class="visor">

      <!-- Cámara -->
      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <!-- Marco -->
      <img
        id="marco"
        src="marco.png"
        alt=""
      >

      <!-- Punto de enfoque -->
      <div
        id="puntoEnfoque"
        aria-hidden="true"
      ></div>

    </div>


    <!-- ==================================================
         CONTROLES
    =================================================== -->

    <div class="controles">

      <!-- Zoom -->
      <div class="controlesZoom">

        <button
          id="zoom05"
          type="button"
        >
          0.5×
        </button>

        <button
          id="zoom1"
          type="button"
          class="activo"
        >
          1×
        </button>

        <button
          id="zoom2"
          type="button"
        >
          2×
        </button>

      </div>


      <!-- Deslizador -->
      <input
        id="zoomSlider"
        type="range"
        min="0.5"
        max="2"
        step="0.1"
        value="1"
        aria-label="Zoom"
      >


      <!-- Botones principales -->
      <div class="controlesPrincipales">

        <button
          id="cambiarCamara"
          type="button"
          aria-label="Cambiar cámara"
        >
          ↻
        </button>

        <button
          id="tomarFoto"
          type="button"
          class="obturador"
          aria-label="Tomar fotografía"
        >
        </button>

      </div>

    </div>

  </main>


  <!-- ==================================================
       RESULTADO
  =================================================== -->

  <main
    id="resultado"
    class="pantalla resultado oculto"
  >

    <div class="resultadoContenido">

      <img
        id="fotoFinal"
        src=""
        alt="Fotografía"
      >

      <div class="acciones">

        <a
          id="descargar"
          href="#"
          download="J-T-15-08-2026.png"
        >
          GUARDAR FOTO
        </a>

        <button
          id="compartir"
          type="button"
        >
          COMPARTIR
        </button>

        <button
          id="otraFoto"
          type="button"
        >
          OTRA FOTO
        </button>

      </div>

    </div>

  </main>


  <script src="app.js"></script>

</body>
</html>
